<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINICITY — Artificial Society</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101812;color:#edf5ed;font:12px system-ui,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%;cursor:grab}.panel{position:fixed;background:rgba(9,16,12,.91);border:1px solid rgba(170,210,175,.22);border-radius:14px;box-shadow:0 12px 38px #0009;backdrop-filter:blur(10px)}#top{left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center;padding:11px 15px;pointer-events:none}.brand{font-weight:900;letter-spacing:.13em}.stats{display:flex;gap:16px;color:#9fb3a1}.stats b{color:#fff}.left{left:12px;top:64px;width:245px;padding:13px}.detail{right:12px;top:64px;width:325px;padding:14px;display:none}.detail.on{display:block}.events{right:12px;bottom:62px;width:325px;max-height:185px;padding:12px;overflow:hidden}.title{font-size:10px;letter-spacing:.15em;color:#9ed0a5;font-weight:900;margin-bottom:10px}.m{margin:9px 0}.m>div{display:flex;justify-content:space-between}.bar{height:5px;background:#1c2a20;border-radius:8px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:#75c681}.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px;color:#a8b8aa}.kv b{color:#fff}.mem{margin-top:12px;color:#a9b8aa;line-height:1.5}.event{padding:5px 0;border-bottom:1px solid #fff1;color:#b2c1b3;font-size:10px}.controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.controls button{border:1px solid #49634e;background:#122018;color:#e8f2e9;border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer}.controls button:hover{background:#1b3021}.hint{position:fixed;top:57px;left:50%;transform:translateX(-50%);color:#7f9482;font-size:9px;pointer-events:none}.tag{display:inline-block;margin:2px 3px 0 0;padding:3px 6px;border-radius:8px;background:#17251b;color:#b7cfb9;font-size:9px}.close{float:right;border:0;background:none;color:#9db19f;font-size:18px;cursor:pointer}</style></head><body><canvas id="c"></canvas><div id="top" class="panel"><div class="brand">MINICITY // ARTIFICIAL SOCIETY</div><div class="stats"><span>YEAR <b id="yr">1</b></span><span>POP <b id="pop">50</b></span><span>FOOD <b id="food">260</b></span><span>WATER <b id="water">10000</b></span><span>TECH <b id="tech">0</b></span></div></div><div class="panel left"><div class="title">SOCIETY</div><div class="m"><div>Survival <b id="sur">100%</b></div><div class="bar"><i id="sb"></i></div></div><div class="m"><div>Knowledge <b id="know">0</b></div><div class="bar"><i id="kb"></i></div></div><div class="m"><div>Culture <b id="cult">0</b></div><div class="bar"><i id="cb"></i></div></div><div class="m"><div>Stability <b id="stab">100%</b></div><div class="bar"><i id="tb"></i></div></div><div class="m">Discoveries <b id="disc">0</b></div><div class="m">Houses <b id="houses">10</b> · Farms <b id="farms">2</b></div></div><div id="detail" class="panel detail"><button class="close" id="close">×</button><div id="dt" class="title">HABITANTE</div><div id="dk" class="kv"></div><div id="skills"></div><div id="dm" class="mem"></div></div><div id="events" class="panel events"></div><div class="hint">CLIQUE EM UMA PESSOA · RODA ZOOM · ARRASTE · ESPAÇO PAUSA · R RESET</div><div class="controls"><button id="pause">PAUSE</button><button id="reset">RESET</button><button id="speed">1×</button><button id="save">SAVE</button></div><script>'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,D=1,zoom=1,panX=0,panY=0,paused=false,speed=1,last=performance.now(),acc=0,day=0,year=1,selected=null,drag=false,dragX=0,dragY=0;
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const names=['Ana','Bruno','Clara','Davi','Elena','Felipe','Gabriela','Hugo','Iara','João','Karina','Leo','Marta','Nuno','Olivia','Paulo','Rita','Sofia','Tiago','Vera','Yara','Zeca','Alice','Bia','Caio','Diana','Eva','Fabi','Gabi','Heitor','Inês','Julia','Lia','Miguel','Nina','Otávio','Pietro','Raquel','Sara','Theo','Ursula','Vitor','Wanda','Xavier','Yasmin','Zoe','Arthur','Beatriz','Celia','Diego','Emma'];
const skills=['agricultura','coleta','construção','ferramentas','pesquisa','medicina','comércio','comunicação'];
const world={food:260,water:10000,wood:500,stone:350,knowledge:0,culture:0,discoveries:[],stability:1,farms:2,houses:10,events:[]};let houses=[],people=[];
function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
for(let i=0;i<10;i++)houses.push({x:(i%5-2)*150,y:(Math.floor(i/5))*120-60,owner:i});
function mk(i){let female=i%2===0;let p={id:i,name:names[i]+'-'+String(i+1).padStart(2,'0'),female,x:rnd(-280,280),y:rnd(-180,180),age:rnd(18,55),health:1,hunger:rnd(.05,.2),thirst:rnd(.05,.2),energy:rnd(.65,1),mood:rnd(.45,.9),intel:rnd(.35,1),curiosity:rnd(.2,1),social:rnd(.2,1),money:rnd(8,40),home:i<10?i:null,job:'explorador',action:'observando',mem:[],children:0,alive:true,skin:['#f1c7a5','#dba27b','#b97852','#8b573b'][i%4],hair:['#241a16','#3b2418','#8a5b32','#c58a4a','#d9d9d9'][i%5],shirt:['#476b9a','#8c4f45','#527b59','#7c638f','#b07a43'][i%5],skills:{}};skills.forEach(s=>p.skills[s]=rnd(.01,.12));return p}for(let i=0;i<50;i++)people.push(mk(i));
function log(t){world.events.unshift(t);world.events.length=8;document.getElementById('events').innerHTML=world.events.map(e=>'<div class="event">'+e+'</div>').join('')}
function remember(p,t){p.mem.unshift('Ano '+year+': '+t);p.mem.length=16}
function learn(p,s,a){p.skills[s]=cl((p.skills[s]||0)+a,0,1);world.knowledge+=a*.2;if(p.skills[s]>.5&&!world.discoveries.includes(s)){world.discoveries.push(s);world.culture+=.05;log('Descoberta coletiva: '+s)}}
function nearest(p,pred){let q=null,d=1e9;for(const z of people)if(z.alive&&z!==p&&(!pred||pred(z))){const n=Math.hypot(z.x-p.x,z.y-p.y);if(n<d)d=n,q=z}return q}
function move(p,tx,ty,dt){let dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*(16+12*p.skills.construção)*dt;p.y+=dy/d*(16+12*p.skills.construção)*dt}
function choose(p){if(p.thirst>.7)return'água';if(p.hunger>.7)return'comida';if(p.energy<.2)return'descanso';if(p.health<.55)return'medicina';let r=Math.random();if(r<.22+p.skills.agricultura*.2)return'agricultura';if(r<.42+p.skills.coleta*.18)return'coleta';if(r<.56+p.skills.construção*.16)return'construção';if(r<.69+p.skills.pesquisa*.18)return'pesquisa';if(r<.84+p.social*.12)return'social';return'comércio'}
function act(p,dt){p.hunger=cl(p.hunger+dt*.002,0,1);p.thirst=cl(p.thirst+dt*.0027,0,1);p.energy=cl(p.energy-dt*.00075,0,1);p.age+=dt/90000;if(p.hunger>.94)p.health-=dt*.003;if(p.thirst>.94)p.health-=dt*.005;const a=p.action;
if(a==='água'){move(p,0,-300,dt);if(Math.hypot(p.x,p.y+300)<35){p.thirst=cl(p.thirst-dt*.7,0,1);world.water=Math.max(0,world.water-dt);learn(p,'coleta',dt*.003)}}
else if(a==='comida'){move(p,260,40,dt);if(Math.hypot(p.x-260,p.y-40)<38&&world.food>0){world.food=Math.max(0,world.food-dt);p.hunger=cl(p.hunger-dt*.6,0,1);learn(p,'coleta',dt*.01)}}
else if(a==='agricultura'){move(p,230,230,dt);if(Math.hypot(p.x-230,p.y-230)<50){world.food+=dt*(1+p.skills.agricultura*4);learn(p,'agricultura',dt*.014);p.job='agricultor';if(p.skills.agricultura>.6&&Math.random()<dt*.004){world.farms++;remember(p,'aperfeiçoou o cultivo')}}}
else if(a==='coleta'){move(p,-280,-180,dt);if(Math.hypot(p.x+280,p.y+180)<50){world.wood+=dt*(1+p.skills.coleta*3);learn(p,'coleta',dt*.01);p.job='coletor'}}
else if(a==='construção'){move(p,0,0,dt);if(Math.hypot(p.x,p.y)<50&&world.wood>3&&world.stone>2){world.wood-=dt;world.stone-=dt*.5;learn(p,'construção',dt*.016);p.job='construtor';if(p.home===null&&p.money>25&&Math.random()<dt*.015){houses.push({x:rnd(-500,500),y:rnd(-350,350),owner:p.id});p.home=houses.length-1;p.money-=25;world.houses++;log(p.name+' construiu uma casa')}}}
else if(a==='pesquisa'){let q=nearest(p);if(q)move(p,q.x,q.y,dt);if(Math.random()<dt*.01){learn(p,'pesquisa',dt*.025);let s=skills[(Math.random()*skills.length)|0];p.skills[s]=cl(p.skills[s]+.025,0,1);remember(p,'testou uma hipótese sobre '+s)}}
else if(a==='social'){let q=nearest(p);if(q){move(p,q.x,q.y,dt);if(Math.hypot(p.x-q.x,p.y-q.y)<28){let s=skills.reduce((a,b)=>p.skills[a]>p.skills[b]?a:b);q.skills[s]=cl(q.skills[s]+dt*.01,0,1);learn(p,'comunicação',dt*.003);if(Math.random()<dt*.015)remember(p,'aprendeu com '+q.name)}}}
else if(a==='comércio'){let q=nearest(p);if(q){move(p,q.x,q.y,dt);if(Math.hypot(p.x-q.x,p.y-q.y)<28&&p.money>1){p.money--;q.money++;learn(p,'comércio',dt*.01);p.job='comerciante'}}}
else if(a==='descanso')p.energy=cl(p.energy+dt*.032,0,1);
else if(a==='medicina'){let q=nearest(p,z=>z.health<.8)||p;if(q===p)p.health=cl(p.health+dt*.01,0,1);else{move(p,q.x,q.y,dt);if(Math.hypot(p.x-q.x,p.y-q.y)<28){q.health=cl(q.health+dt*.018,0,1);learn(p,'medicina',dt*.014);p.job='curador'}}}
if(p.health<=0&&p.alive){p.alive=false;log(p.name+' morreu aos '+p.age.toFixed(1)+' anos');if(selected===p)show(null)}}
function tick(){day++;if(day%365===0){year++;log('Ano '+year+' começou')}const alive=people.filter(p=>p.alive);world.food=Math.max(0,world.food-alive.length*.04);world.water=Math.max(0,world.water-alive.length*.11);if(day%10===0)alive.forEach(p=>{if(Math.random()<.55)p.action=choose(p);act(p,.8)});alive.forEach(p=>{if(Math.random()<.018)p.action=choose(p)});world.stability=cl(.8-(world.food<80?.2:0)-(world.water<1000?.1:0)+world.culture*.04,.05,1)}
function screen(wx,wy){return[W/2+panX+wx*zoom,H/2+panY+wy*zoom]}
function drawPerson(p){const [sx,sy]=screen(p.x,p.y),s=cl(zoom,0.55,2.8);if(sx<-40||sx>W+40||sy<-60||sy>H+60)return;const sc=s*1.55;ctx.save();ctx.translate(sx,sy);ctx.scale(sc,sc);const selected=p===selected;const moving=!['descanso','observando'].includes(p.action);if(selected){ctx.beginPath();ctx.fillStyle='rgba(255,230,120,.18)';ctx.ellipse(0,2,17,22,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffe37a';ctx.lineWidth=1.4;ctx.stroke()}ctx.strokeStyle='#202722';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5,9);ctx.lineTo(-7,20);ctx.moveTo(5,9);ctx.lineTo(7,20);ctx.stroke();ctx.strokeStyle=p.skin;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-7,1);ctx.lineTo(-11,10);ctx.moveTo(7,1);ctx.lineTo(11,10);ctx.stroke();ctx.fillStyle=p.shirt;ctx.beginPath();ctx.roundRect(-7,-2,14,14,4);ctx.fill();ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(0,-10,7,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.hair;ctx.beginPath();ctx.arc(0,-13,7,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-7,-13,14,3);ctx.fillStyle='#202020';ctx.beginPath();ctx.arc(-2.4,-10,1,0,Math.PI*2);ctx.arc(2.4,-10,1,0,Math.PI*2);ctx.fill();if(moving){ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-2,20);ctx.lineTo(-4,24);ctx.moveTo(2,20);ctx.lineTo(4,24);ctx.stroke()}if(selected||zoom>1.45){ctx.fillStyle='#f2f5f2';ctx.font='bold 7px system-ui';ctx.textAlign='center';ctx.fillText(p.name,0,31)}ctx.restore()}
function draw(){ctx.fillStyle='#6d996d';ctx.fillRect(0,0,W,H);let [cx,cy]=screen(0,0);ctx.fillStyle='#57905e';ctx.fillRect(cx-900*zoom,cy-650*zoom,1800*zoom,1300*zoom);ctx.fillStyle='#4f8db6';let river=screen(-650,-340);ctx.fillRect(river[0],river[1],1300*zoom,78*zoom);ctx.strokeStyle='#ad9878';ctx.lineWidth=11*zoom;for(let z=-600;z<=600;z+=150){let a=screen(z,-350),b=screen(z,350);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}for(let z=-300;z<=300;z+=120){let a=screen(-600,z),b=screen(600,z);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}ctx.fillStyle='#829b46';let farm=screen(170,170);ctx.fillRect(farm[0],farm[1],140*zoom,105*zoom);for(let i=0;i<8;i++){ctx.strokeStyle='#617b36';ctx.lineWidth=2*zoom;ctx.beginPath();ctx.moveTo(farm[0]+10*zoom+i*16*zoom,farm[1]);ctx.lineTo(farm[0]+10*zoom+i*16*zoom,farm[1]+105*zoom);ctx.stroke()}houses.forEach(h=>{let a=screen(h.x,h.y),w=44*zoom,hg=31*zoom;ctx.fillStyle='#d2b184';ctx.fillRect(a[0]-w/2,a[1]-hg/2,w,hg);ctx.fillStyle='#754b42';ctx.beginPath();ctx.moveTo(a[0]-w*.62,a[1]-hg/2);ctx.lineTo(a[0],a[1]-hg);ctx.lineTo(a[0]+w*.62,a[1]-hg/2);ctx.fill();ctx.fillStyle='#4d6e59';ctx.fillRect(a[0]-5*zoom,a[1],10*zoom,10*zoom)});people.filter(p=>p.alive).forEach(drawPerson)}
function show(p){selected=p;const d=document.getElementById('detail');if(!p){d.classList.remove('on');return}d.classList.add('on');document.getElementById('dt').textContent=p.name.toUpperCase()+' · '+p.job.toUpperCase();document.getElementById('dk').innerHTML='<span>Idade</span><b>'+p.age.toFixed(1)+'</b><span>Saúde</span><b>'+((p.health*100)|0)+'%</b><span>Humor</span><b>'+((p.mood*100)|0)+'%</b><span>Energia</span><b>'+((p.energy*100)|0)+'%</b><span>Fome</span><b>'+((p.hunger*100)|0)+'%</b><span>Sede</span><b>'+((p.thirst*100)|0)+'%</b><span>Dinheiro</span><b>'+p.money.toFixed(0)+'</b><span>Ação</span><b>'+p.action+'</b>';let top=skills.map(s=>[s,p.skills[s]]).sort((a,b)=>b[1]-a[1]).slice(0,4);document.getElementById('skills').innerHTML='<div class="title" style="margin-top:12px">HABILIDADES</div>'+top.map(v=>'<span class="tag">'+v[0]+' '+Math.round(v[1]*100)+'</span>').join('');document.getElementById('dm').innerHTML='<b>Memória</b><br>'+((p.mem||[]).slice(0,5).join('<br>')||'Ainda não possui memórias relevantes.')}
function ui(){const a=people.filter(p=>p.alive),s=a.reduce((n,p)=>n+p.health,0)/(a.length||1),k=Math.min(100,world.knowledge),cu=Math.min(100,world.culture*100),st=world.stability*100;const vals={yr:year,pop:a.length,food:world.food|0,water:world.water|0,tech:world.discoveries.length,sur:(s*100).toFixed(0)+'%',know:k|0,cult:cu|0,stab:(st|0)+'%',disc:world.discoveries.length,houses:world.houses,farms:world.farms};for(const [i,v] of Object.entries(vals))document.getElementById(i).textContent=v;for(const [i,v] of [['sb',s*100],['kb',k],['cb',cu],['tb',st]])document.getElementById(i).style.width=cl(v,0,100)+'%';if(selected&&selected.alive)show(selected)}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){acc+=dt*speed;while(acc>.045){tick();acc-=.045}}draw();ui();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function pick(mx,my){let best=null,bd=1e9;for(const p of people)if(p.alive){const [sx,sy]=screen(p.x,p.y);const d=Math.hypot(mx-sx,my-(sy-7*zoom));const hit=18*cl(zoom,.7,2.5);if(d<hit&&d<bd){bd=d;best=p}}show(best)}
c.addEventListener('click',e=>{if(!drag)pick(e.clientX,e.clientY)});c.addEventListener('pointerdown',e=>{drag=false;dragX=e.clientX;dragY=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(e.buttons){const dx=e.clientX-dragX,dy=e.clientY-dragY;if(Math.abs(dx)+Math.abs(dy)>3)drag=true;panX+=dx;panY+=dy;dragX=e.clientX;dragY=e.clientY}});c.addEventListener('wheel',e=>{e.preventDefault();zoom=cl(zoom*(e.deltaY<0?1.12:.89),.55,3.2)},{passive:false});
document.getElementById('close').onclick=()=>show(null);document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'PLAY':'PAUSE'};document.getElementById('speed').onclick=()=>{speed=speed===1?3:speed===3?10:1;document.getElementById('speed').textContent=speed+'×'};document.getElementById('reset').onclick=()=>location.reload();document.getElementById('save').onclick=()=>{localStorage.setItem('minicity-save',JSON.stringify({people,world,houses,day,year}));log('Simulação salva neste navegador')};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('pause').click()}if(e.key.toLowerCase()==='r')document.getElementById('reset').click()});log('50 habitantes entraram na simulação');</script></body></html>
