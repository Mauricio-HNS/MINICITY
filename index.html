<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINICITY — Artificial Society</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100b;color:#e8f4e8;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}canvas{display:block;width:100%;height:100%;background:#08130c}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(7,17,12,.88);border:1px solid rgba(150,205,155,.2);box-shadow:0 10px 35px #0007;backdrop-filter:blur(9px);border-radius:12px}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}.brand{padding:10px 13px;font-weight:800;letter-spacing:.12em}.stats{padding:10px 13px;display:flex;gap:14px;font-size:11px;color:#9db4a1}.stats b{color:#f5fff5}.left{position:absolute;left:12px;top:62px;width:275px;padding:12px}.left h3,.detail h3{font-size:11px;letter-spacing:.12em;color:#9ad2a0;margin:0 0 10px}.metric{font-size:11px;margin:7px 0}.metric span{display:flex;justify-content:space-between}.bar{height:5px;background:#17271a;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#7bc784}.events{position:absolute;right:12px;bottom:12px;width:315px;max-height:235px;overflow:hidden;padding:10px 12px}.event{font-size:10px;color:#b2c6b4;padding:5px 0;border-bottom:1px solid #fff1}.detail{position:absolute;right:12px;top:62px;width:315px;padding:12px;display:none}.detail.on{display:block}.kv{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:10px;color:#a9baa9}.kv b{color:#edf8ed}.log{margin-top:9px;max-height:105px;overflow:hidden;font-size:10px;color:#8fa18f}.controls{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}.controls button{background:#0c1b10;color:#dff2e0;border:1px solid #34553a;border-radius:8px;padding:8px 11px;cursor:pointer}.controls button:hover{border-color:#86c58d}.hint{position:absolute;left:50%;top:58px;transform:translateX(-50%);font-size:9px;color:#6d8270}.tag{display:inline-block;padding:2px 5px;border-radius:5px;background:#17321b;color:#9ed6a3;margin-right:4px}.warning{color:#e8b36d!important}
</style></head>
<body><canvas id="world"></canvas><div class="hud">
<div class="top"><div class="panel brand">MINICITY // ARTIFICIAL SOCIETY</div><div class="panel stats"><span>YEAR <b id="year">1</b></span><span>POP <b id="pop">50</b></span><span>FOOD <b id="food">0</b></span><span>WATER <b id="water">0</b></span><span>TECH <b id="tech">0</b></span></div></div>
<div class="panel left"><h3>SOCIETY</h3><div class="metric"><span><span>Survival</span><b id="survival">100%</b></span><div class="bar"><i id="survivalBar"></i></div></div><div class="metric"><span><span>Collective knowledge</span><b id="knowledge">0</b></span><div class="bar"><i id="knowledgeBar"></i></div></div><div class="metric"><span><span>Cultural complexity</span><b id="culture">0</b></span><div class="bar"><i id="cultureBar"></i></div></div><div class="metric"><span><span>Social stability</span><b id="stability">100%</b></span><div class="bar"><i id="stabilityBar"></i></div></div><div class="metric"><span><span>Dominant discoveries</span><b id="discoveries">0</b></span></div></div>
<div id="detail" class="panel detail"><h3 id="detailTitle">PERSON</h3><div class="kv" id="detailKv"></div><div class="log" id="detailLog"></div></div>
<div id="events" class="panel events"></div><div class="hint">CLICK A PERSON · WHEEL ZOOM · SPACE PAUSE · R RESET</div>
<div class="controls"><button id="pause">PAUSE</button><button id="reset">RESET</button><button id="speed">1×</button><button id="save">SAVE</button></div>
</div>
<script>
'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,zoom=1,paused=false,speed=1,selected=null,simTime=0,last=performance.now();
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const names=['Ana','Bruno','Clara','Davi','Elena','Felipe','Gabriela','Hugo','Iara','Joao','Karina','Leo','Marta','Nuno','Olivia','Paulo','Rita','Sofia','Tiago','Vera','Yara','Zeca','Alice','Bia','Caio','Diana','Eva','Fabi','Gabi','Heitor','Ines','Julia','Lia','Miguel','Nina','Otavio','Pietro','Raquel','Sara','Theo','Ursula','Vitor','Wanda','Xavier','Yasmin','Zoe','Arthur','Beatriz','Celia','Diego','Emma'];
const world={w:1500,h:1000,year:1,food:240,water:320,wood:180,stone:140,ore:80,seeds:45,fish:55,medicine:10,tools:20,houses:10,farms:1,workshops:0,roads:0,knowledge:0,culture:0,stability:1,survival:1,tech:0,discoveries:new Set(),events:[],memory:[]};
const SKILLS=['gathering','farming','fishing','hunting','building','crafting','cooking','medicine','mining','trading','teaching','research'];
const MATERIALS=['wood','stone','ore'];
const people=[];let nextId=1;
function log(text){world.events.unshift({text,t:simTime});world.events=world.events.slice(0,10);document.getElementById('events').innerHTML=world.events.map(e=>`<div class="event">${e.text}</div>`).join('')}
function makePerson(age){const p={id:nextId++,name:names[(nextId-2)%names.length]+'-'+String(nextId).padStart(2,'0'),age:age??rand(18,55),x:rand(-300,300),y:rand(-200,200),energy:1,hunger:0,thirst:0,health:1,mood:.65,intel:rand(.35,.9),curiosity:rand(.2,.95),risk:rand(.1,.8),social:rand(.2,.95),memory:[],skills:{},knowledge:new Set(),inventory:{food:rand(1,5),water:rand(1,5),wood:0,stone:0,ore:0,tools:rand(0,1)},money:rand(5,30),property:[],relations:{},beliefs:[],goal:'survive',action:'observing',target:null,children:0,failures:0,successes:0,ageDays:rand(0,300),color:rand(0,1)};SKILLS.forEach(s=>p.skills[s]=rand(.01,.12));return p}
function addMemory(p,text,score=0){p.memory.unshift({text,score,t:world.year});p.memory=p.memory.slice(0,25)}
function learn(p,skill,amount){p.skills[skill]=clamp((p.skills[skill]||0)+amount,0,1);p.knowledge.add(skill);world.knowledge+=amount*.35}
function resourceFor(skill){return {gathering:'food',farming:'food',fishing:'fish',hunting:'food',building:'wood',crafting:'wood',cooking:'food',medicine:'medicine',mining:'ore',trading:'money',teaching:'knowledge',research:'knowledge'}[skill]}
function chooseAction(p){
 const needs=[['thirst',p.thirst],['hunger',p.hunger],['health',1-p.health],['energy',1-p.energy]].sort((a,b)=>b[1]-a[1]);
 if(needs[0][1]>.72){p.goal=needs[0][0]==='thirst'?'find water':needs[0][0]==='hunger'?'find food':needs[0][0]==='energy'?'rest':'seek medicine';return needs[0][0]==='energy'?'rest':needs[0][0]==='thirst'?'drink':needs[0][0]==='hunger'?'gather':'heal'}
 const scarcity=world.food<100?'food':world.water<130?'water':world.wood<80?'wood':world.tools<12?'tools':null;
 if(scarcity){if(scarcity==='food')return p.skills.farming>p.skills.gathering?'farm':'gather';if(scarcity==='water')return 'drink';if(scarcity==='wood')return 'gather wood';return 'craft tools'}
 const options=[['gather',.18+p.skills.gathering],['farm',.12+p.skills.farming],['fish',.08+p.skills.fishing],['build',.06+p.skills.building],['craft',.06+p.skills.crafting],['mine',.05+p.skills.mining],['research',.03+p.skills.research+p.curiosity*.12],['teach',.03+p.skills.teaching],['trade',.03+p.skills.trading],['socialize',.04+p.social],['rest',.04]];
 let total=options.reduce((a,x)=>a+x[1],0),r=Math.random()*total;for(const [a,w] of options){r-=w;if(r<=0)return a}return 'gather';
}
function nearest(p,pred){let best=null,bd=1e9;for(const q of people)if(q!==p&&(!pred||pred(q))){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}}return best}
function move(p,tx,ty,dt){let dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*22*dt*(.5+p.energy);p.y+=dy/d*22*dt*(.5+p.energy);p.x=clamp(p.x,-world.w/2+25,world.w/2-25);p.y=clamp(p.y,-world.h/2+25,world.h/2-25)}
function act(p,dt){p.hunger=clamp(p.hunger+dt*.0035,0,1);p.thirst=clamp(p.thirst+dt*.005,0,1);p.energy=clamp(p.energy-dt*.002,0,1);p.ageDays+=dt*.7;p.age=p.ageDays/365+18;
 const a=p.action;
 if(a==='rest'){p.energy=clamp(p.energy+dt*.03,0,1);p.mood=clamp(p.mood+dt*.002,0,1);return}
 if(a==='drink'){move(p,80,-160,dt);if(Math.hypot(p.x-80,p.y+160)<24){world.water=Math.max(0,world.water-dt*.8);p.thirst=clamp(p.thirst-dt*.7,0,1);addMemory(p,'Água próxima ao rio reduz a sede.',.7);learn(p,'gathering',dt*.002)}return}
 if(a==='gather'||a==='gather wood'){const target=a==='gather'?'food':'wood';const tx=target==='food'?260:-300,ty=target==='food'?80:-180;move(p,tx,ty,dt);if(Math.hypot(p.x-tx,p.y-ty)<35){if(target==='food'&&world.food>0){world.food+=dt*(.8+p.skills.gathering*2);learn(p,'gathering',dt*.008);if(Math.random()<dt*.004){addMemory(p,'Encontrou alimento selvagem.',1);discover('foraging')}}if(target==='wood'&&world.wood>0){world.wood+=dt*(.6+p.skills.gathering*1.4);learn(p,'gathering',dt*.006)}}return}
 if(a==='farm'){move(p,220,230,dt);if(Math.hypot(p.x-220,p.y-230)<45){world.food+=dt*(.5+p.skills.farming*3);world.seeds=Math.max(0,world.seeds-dt*.01);learn(p,'farming',dt*.012);if(Math.random()<dt*.006&&p.skills.farming>.2){discover('agriculture');addMemory(p,'Experimentos com sementes melhoraram o cultivo.',1)}}return}
 if(a==='fish'){move(p,-10,310,dt);if(Math.hypot(p.x+10,p.y-310)<40&&world.fish>0){let catchRate=.5+p.skills.fishing*2;world.fish=Math.max(0,world.fish-dt*catchRate*.5);world.food+=dt*catchRate;learn(p,'fishing',dt*.01);if(world.fish<15)discover('overfishing')}}
 if(a==='mine'){move(p,-270,240,dt);if(Math.hypot(p.x+270,p.y-240)<40&&world.ore>0){world.ore=Math.max(0,world.ore-dt*.35);learn(p,'mining',dt*.01);if(world.ore<20)discover('resource scarcity')}}
 if(a==='build'){const need=world.wood>8&&world.stone>5;if(need){move(p,0,0,dt);if(Math.hypot(p.x,p.y)<55){world.wood-=dt*1.2;world.stone-=dt*.7;p.skills.building=clamp(p.skills.building+dt*.01,0,1);if(Math.random()<dt*.012&&world.houses<35){world.houses++;discover('construction');addMemory(p,'Aprendeu uma sequência de construção mais eficiente.',1)}}}return}
 if(a==='craft'){move(p,-80,0,dt);if(Math.hypot(p.x+80,p.y)<45&&world.wood>2&&world.ore>1){world.wood-=dt*.7;world.ore-=dt*.3;world.tools+=dt*.35;learn(p,'crafting',dt*.014);if(Math.random()<dt*.01){discover('toolmaking');addMemory(p,'Uma ferramenta durável surgiu de tentativa e erro.',1)}}return}
 if(a==='research'){const q=nearest(p);if(q)move(p,q.x,q.y,dt);else p.action='gather';if(Math.random()<dt*.008){learn(p,'research',.01);const candidate=['irrigation','food storage','medicine','weaving','writing','mathematics','navigation','trade networks'][Math.floor(Math.random()*8)];if(p.skills.research+p.intel*.2>Math.random()*.9)discover(candidate);addMemory(p,'Formulou uma hipótese e comparou resultados.',.8)}return}
 if(a==='teach'){const q=nearest(p,x=>p.knowledge.size>x.knowledge.size);if(q){move(p,q.x,q.y,dt);if(Math.hypot(p.x-q.x,p.y-q.y)<28){const known=[...p.knowledge];if(known.length){const k=known[Math.floor(Math.random()*known.length)];learn(q,k,.015+p.skills.teaching*.02);addMemory(p,'Compartilhou conhecimento com '+q.name+'.',.8);addMemory(q,'Aprendeu '+k+' com '+p.name+'.',.8)}}}return}
 if(a==='trade'){const q=nearest(p);if(q){move(p,q.x,q.y,dt);if(Math.hypot(p.x-q.x,p.y-q.y)<25&&Math.random()<dt*.25){let give=Math.min(2,p.inventory.food);if(give>0){p.inventory.food-=give;q.inventory.food+=give;p.money+=give;q.money-=give;learn(p,'trading',.004);addMemory(p,'Troca de alimento realizada.',.6);world.culture+=.002}}}return}
 if(a==='socialize'){const q=nearest(p);if(q){move(p,q.x,q.y,dt);if(Math.hypot(p.x-q.x,p.y-q.y)<24){p.mood=clamp(p.mood+dt*.015,0,1);p.relations[q.id]=clamp((p.relations[q.id]||0)+dt*.03,0,1)}}return}
}
function discover(name){if(world.discoveries.has(name))return;world.discoveries.add(name);world.tech++;world.culture+=.08;log('DESCOBERTA: '+name+' emergiu da experiência coletiva.');world.memory.push({year:world.year,text:name});}
function consume(){world.food=Math.max(0,world.food-people.length*.0008);world.water=Math.max(0,world.water-people.length*.0012);world.wood=Math.max(0,world.wood-people.length*.00015);world.survival=clamp(Math.min(world.food/120,world.water/160,.35+world.houses/50),0,1);world.stability=clamp(.55+world.food/500+world.water/600+world.culture*.15-people.filter(p=>p.hunger>.7).length*.004,0,1)}
function generation(){for(const p of people){if(p.age>78||p.health<.05){log(p.name+' morreu após '+Math.floor(p.age)+' anos.');const idx=people.indexOf(p);if(idx>=0)people.splice(idx,1)}}while(people.length<50){const child=makePerson(rand(0,3));child.name=names[Math.floor(Math.random()*names.length)]+'-'+String(nextId).padStart(2,'0');child.x=rand(-100,100);child.y=rand(-100,100);child.intel=clamp(rand(.3,.85)+world.culture*.03,0,1);child.knowledge=new Set([...world.discoveries].slice(0,Math.min(3,world.discoveries.size)));child.action='observing';people.push(child);log(child.name+' nasceu em uma nova geração.')}}
function yearTick(){world.year++;for(const p of people){p.ageDays+=365;p.health=clamp(p.health-(p.age>70?.04:.008),0,1);if(p.age>20&&p.age<42&&Math.random()<.045){p.children++;const baby=makePerson(0);baby.x=p.x+rand(-20,20);baby.y=p.y+rand(-20,20);baby.intel=clamp(p.intel+rand(-.15,.15),.1,.95);baby.knowledge=new Set([...p.knowledge].slice(0,4));people.push(baby);log(p.name+' teve um filho. A cultura é transmitida parcialmente.')}}generation();if(world.food<70)log('PROBLEMA: escassez de alimento.');if(world.water<90)log('PROBLEMA: escassez de água.');if(world.fish<10)log('PROBLEMA: lago sobreexplorado.');if(world.wood<50)log('PROBLEMA: floresta pressionada.');}
function init(){people.length=0;nextId=1;Object.assign(world,{year:1,food:240,water:320,wood:180,stone:140,ore:80,seeds:45,fish:55,medicine:10,tools:20,houses:10,farms:1,workshops:0,roads:0,knowledge:0,culture:0,stability:1,survival:1,tech:0});world.discoveries=new Set();world.events=[];world.memory=[];for(let i=0;i<50;i++){const p=makePerson(i<10?rand(20,40):rand(18,60));p.x=rand(-260,260);p.y=rand(-180,180);people.push(p)}log('50 habitantes iniciaram uma sociedade sem profissões predefinidas.');for(const p of people)p.action=chooseAction(p)}
function save(){const data={world:{...world,discoveries:[...world.discoveries]},people:people.map(p=>({...p,knowledge:[...p.knowledge]}))};localStorage.setItem('minicity-mvp',JSON.stringify(data));log('Estado persistido no navegador.')}function load(){try{const d=JSON.parse(localStorage.getItem('minicity-mvp'));if(!d)return false;Object.assign(world,d.world);world.discoveries=new Set(d.world.discoveries||[]);people.length=0;for(const p of d.people){p.knowledge=new Set(p.knowledge||[]);people.push(p)}return true}catch{return false}}
function draw(){ctx.fillStyle='#08130c';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);const sx=W/zoom,sy=H/zoom;ctx.strokeStyle='#ffffff0b';for(let x=-750;x<750;x+=100){ctx.beginPath();ctx.moveTo(x,-500);ctx.lineTo(x,500);ctx.stroke()}for(let y=-500;y<500;y+=100){ctx.beginPath();ctx.moveTo(-750,y);ctx.lineTo(750,y);ctx.stroke()}
 // river, lake, forest, mine, farm
 ctx.fillStyle='#173b42';ctx.beginPath();ctx.moveTo(-80,-500);ctx.quadraticCurveTo(100,-220,20,40);ctx.quadraticCurveTo(-80,250,50,500);ctx.lineTo(150,500);ctx.quadraticCurveTo(20,250,100,20);ctx.quadraticCurveTo(190,-240,60,-500);ctx.fill();
 ctx.fillStyle='#102719';ctx.beginPath();ctx.arc(-300,-180,150,0,TAU);ctx.fill();ctx.fillStyle='#17311a';ctx.beginPath();ctx.arc(-10,310,75,0,TAU);ctx.fill();ctx.fillStyle='#172b19';ctx.fillRect(160,180,180,120);ctx.strokeStyle='#56795a';ctx.strokeRect(160,180,180,120);ctx.fillStyle='#1c2a20';ctx.fillRect(-330,180,120,120);
 // village
 for(let i=0;i<world.houses;i++){const a=i*2.4,r=35+(i%4)*22,x=Math.cos(a)*r,y=Math.sin(a)*r;ctx.fillStyle='#8a6a43';ctx.fillRect(x-8,y-7,16,14);ctx.fillStyle='#b58b57';ctx.beginPath();ctx.moveTo(x-10,y-7);ctx.lineTo(x,y-16);ctx.lineTo(x+10,y-7);ctx.fill()}
 for(const p of people){const px=p.x,py=p.y;ctx.save();ctx.translate(px,py);ctx.fillStyle=p.health<.3?'#d36d62':p.color>.5?'#8acb91':'#b9d9c0';ctx.beginPath();ctx.arc(0,-4,4.5,0,TAU);ctx.fill();ctx.fillStyle='#b28b65';ctx.fillRect(-3,0,6,7);if(p===selected){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.stroke()}ctx.restore()}
 ctx.restore()}
function update(dt){simTime+=dt;for(const p of people){if(!p.action||Math.random()<dt*.12)p.action=chooseAction(p);act(p,dt);if(p.thirst>.92||p.hunger>.92)p.health=clamp(p.health-dt*.012,0,1);if(Math.random()<dt*.015){const k=[...p.knowledge];if(k.length){learn(p,k[Math.floor(Math.random()*k.length)],.001)}}}consume();if(Math.floor(simTime)%8===0&&Math.random()<dt)yearTick();}
function hud(){document.getElementById('year').textContent=world.year;document.getElementById('pop').textContent=people.length;document.getElementById('food').textContent=Math.floor(world.food);document.getElementById('water').textContent=Math.floor(world.water);document.getElementById('tech').textContent=world.tech;document.getElementById('survival').textContent=Math.round(world.survival*100)+'%';document.getElementById('survivalBar').style.width=(world.survival*100)+'%';document.getElementById('knowledge').textContent=Math.floor(world.knowledge);document.getElementById('knowledgeBar').style.width=Math.min(100,world.knowledge)+'%';document.getElementById('culture').textContent=world.culture.toFixed(1);document.getElementById('cultureBar').style.width=Math.min(100,world.culture*10)+'%';document.getElementById('stability').textContent=Math.round(world.stability*100)+'%';document.getElementById('stabilityBar').style.width=(world.stability*100)+'%';document.getElementById('discoveries').textContent=world.discoveries.size;if(selected){document.getElementById('detail').classList.add('on');document.getElementById('detailTitle').textContent=selected.name;const top=Object.entries(selected.skills).sort((a,b)=>b[1]-a[1]).slice(0,6);document.getElementById('detailKv').innerHTML=`<span>Idade</span><b>${selected.age.toFixed(1)}</b><span>Inteligência</span><b>${selected.intel.toFixed(2)}</b><span>Curiosidade</span><b>${selected.curiosity.toFixed(2)}</b><span>Humor</span><b>${Math.round(selected.mood*100)}%</b><span>Objetivo</span><b>${selected.goal}</b><span>Ação</span><b>${selected.action}</b><span>Memórias</span><b>${selected.memory.length}</b><span>Conhecimento</span><b>${selected.knowledge.size}</b><span>Dinheiro</span><b>${selected.money.toFixed(1)}</b><span>Habilidades</span><b>${top.map(x=>x[0]+':'+x[1].toFixed(2)).join(', ')}</b>`;document.getElementById('detailLog').innerHTML=selected.memory.slice(0,7).map(m=>`<div>• ${m.text}</div>`).join('')}}else document.getElementById('detail').classList.remove('on')}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)update(dt*speed);draw();hud()}init();requestAnimationFrame(frame);
canvas.addEventListener('wheel',e=>{zoom=clamp(zoom*(e.deltaY<0?1.12:.9),.55,2.3)});canvas.addEventListener('click',e=>{const x=(e.clientX-W/2)/zoom,y=(e.clientY-H/2)/zoom;selected=null;let bd=15;for(const p of people){const d=Math.hypot(x-p.x,y-p.y);if(d<bd){bd=d;selected=p}}});addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;document.getElementById('pause').textContent=paused?'RESUME':'PAUSE'}if(e.key.toLowerCase()==='r')init()});document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'RESUME':'PAUSE'};document.getElementById('reset').onclick=init;document.getElementById('speed').onclick=()=>{speed=speed===1?4:speed===4?12:1;document.getElementById('speed').textContent=speed+'×'};document.getElementById('save').onclick=save;
</script></body></html>
