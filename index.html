<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINICITY — Artificial Society</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09120c;color:#edf7ee;font:12px system-ui,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%;cursor:grab}.p{position:fixed;background:#09140ee8;border:1px solid #9ac49d33;border-radius:12px;box-shadow:0 8px 28px #0008;backdrop-filter:blur(8px)}#top{left:12px;right:12px;top:12px;display:flex;justify-content:space-between;pointer-events:none}.brand,.stats,.left,.detail,.events{padding:11px 13px}.brand{font-weight:900;letter-spacing:.12em}.stats{display:flex;gap:14px;color:#9eb5a1}.stats b{color:#fff}.left{left:12px;top:62px;width:260px}.detail{right:12px;top:62px;width:315px;display:none}.detail.on{display:block}.events{right:12px;bottom:62px;width:315px;max-height:190px;overflow:hidden}.title{font-size:10px;letter-spacing:.14em;color:#9fd0a5;font-weight:800;margin-bottom:8px}.m{margin:8px 0}.m div{display:flex;justify-content:space-between}.bar{height:5px;background:#18271b;border-radius:8px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:#75c481}.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;color:#aabdab}.kv b{color:#fff}.mem{margin-top:10px;color:#9aab9c;line-height:1.45}.event{padding:5px 0;border-bottom:1px solid #fff1;color:#aebfae;font-size:10px}.controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.controls button{border:1px solid #49674d;background:#102016;color:#e7f3e8;border-radius:8px;padding:8px 12px;font-weight:800}.hint{position:fixed;top:57px;left:50%;transform:translateX(-50%);color:#708371;font-size:9px}</style></head><body><canvas id="c"></canvas><div id="top" class="p"><div class="brand">MINICITY // ARTIFICIAL SOCIETY</div><div class="stats"><span>YEAR <b id="yr">1</b></span><span>POP <b id="pop">50</b></span><span>FOOD <b id="food">0</b></span><span>WATER <b id="water">0</b></span><span>TECH <b id="tech">0</b></span></div></div><div class="p left"><div class="title">SOCIETY</div><div class="m"><div>Survival <b id="sur">100%</b></div><div class="bar"><i id="sb"></i></div></div><div class="m"><div>Knowledge <b id="know">0</b></div><div class="bar"><i id="kb"></i></div></div><div class="m"><div>Culture <b id="cult">0</b></div><div class="bar"><i id="cb"></i></div></div><div class="m"><div>Stability <b id="stab">100%</b></div><div class="bar"><i id="tb"></i></div></div><div class="m">Discoveries <b id="disc">0</b></div><div class="m">Houses <b id="houses">10</b> · Farms <b id="farms">2</b></div></div><div id="detail" class="p detail"><div id="dt" class="title">HABITANTE</div><div id="dk" class="kv"></div><div id="dm" class="mem"></div></div><div id="events" class="p events"></div><div class="hint">CLICK A PERSON · WHEEL ZOOM · ARRASTE · SPACE PAUSE · R RESET</div><div class="controls"><button id="pause">PAUSE</button><button id="reset">RESET</button><button id="speed">1×</button><button id="save">SAVE</button></div><script>
'use strict';const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,zoom=1,px=0,py=0,paused=false,spd=1,last=performance.now(),acc=0,day=0,year=1,sel=null;const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));const names=['Ana','Bruno','Clara','Davi','Elena','Felipe','Gabriela','Hugo','Iara','João','Karina','Leo','Marta','Nuno','Olivia','Paulo','Rita','Sofia','Tiago','Vera','Yara','Zeca','Alice','Bia','Caio','Diana','Eva','Fabi','Gabi','Heitor','Inês','Julia','Lia','Miguel','Nina','Otávio','Pietro','Raquel','Sara','Theo','Ursula','Vitor','Wanda','Xavier','Yasmin','Zoe','Arthur','Beatriz','Celia','Diego','Emma'];const skills=['agricultura','coleta','construção','ferramentas','pesquisa','medicina','comércio','comunicação'];const world={food:260,water:10000,wood:500,stone:350,ore:120,houses:10,farms:2,knowledge:0,culture:0,discoveries:[],stability:1,events:[]};let houses=[],people=[];function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();for(let i=0;i<10;i++)houses.push({x:(i%5-2)*150,y:(i/5|0)*120-60,owner:i});function mk(i){let p={id:i,name:names[i%50]+'-'+String(i+1).padStart(2,'0'),x:R(-260,260),y:R(-190,190),age:R(18,55),health:1,hunger:R(.05,.2),thirst:R(.05,.2),energy:R(.65,1),mood:R(.45,.9),intel:R(.35,1),curiosity:R(.2,1),social:R(.2,1),money:R(8,40),home:i<10?i:null,job:'explorador',action:'observando',mem:[],skills:{},rel:{},children:0,alive:true};skills.forEach(s=>p.skills[s]=R(.01,.12));return p}for(let i=0;i<50;i++)people.push(mk(i));function ev(t){world.events.unshift(t);world.events.length=9;events.innerHTML=world.events.map(e=>'<div class="event">'+e+'</div>').join('')}function mem(p,t){p.mem.unshift('Ano '+year+': '+t);p.mem.length=18}function learn(p,s,a){p.skills[s]=cl((p.skills[s]||0)+a,0,1);world.knowledge+=a*.2;if(p.skills[s]>.5&&!world.discoveries.includes(s)){world.discoveries.push(s);world.culture+=.05;ev('Descoberta coletiva: '+s)}}function near(p,pred){let q=null,d=1e9;for(let z of people)if(z.alive&&z!==p&&(!pred||pred(z))){let n=Math.hypot(z.x-p.x,z.y-p.y);if(n<d)d=n,q=z}return q}function move(p,a,b,dt){let dx=a-p.x,dy=b-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*(18+16*p.skills.construção)*dt;p.y+=dy/d*(18+16*p.skills.construção)*dt}function choose(p){if(p.thirst>.72)return'água';if(p.hunger>.72)return'comida';if(p.energy<.18)return'descanso';if(p.health<.55)return'medicina';let r=Math.random();if(r<.25+p.skills.agricultura*.2)return'agricultura';if(r<.45+p.skills.coleta*.2)return'coleta';if(r<.58+p.skills.construção*.15)return'construção';if(r<.7+p.skills.pesquisa*.2)return'pesquisa';if(r<.84+p.social*.15)return'social';return'comércio'}function act(p,dt){p.hunger=cl(p.hunger+dt*.002,0,1);p.thirst=cl(p.thirst+dt*.0028,0,1);p.energy=cl(p.energy-dt*.0008,0,1);p.age+=dt/90000;if(p.hunger>.94)p.health-=dt*.004;if(p.thirst>.94)p.health-=dt*.006;let a=p.action;if(a==='água'){move(p,0,-300,dt);if(Math.hypot(p.x,p.y+300)<30){p.thirst=cl(p.thirst-dt*.8,0,1);world.water=Math.max(0,world.water-dt);learn(p,'coleta',dt*.003)}}else if(a==='comida'){move(p,260,40,dt);if(Math.hypot(p.x-260,p.y-40)<35&&world.food>0){world.food=Math.max(0,world.food-dt);p.hunger=cl(p.hunger-dt*.65,0,1);learn(p,'coleta',dt*.012)}}else if(a==='agricultura'){move(p,230,230,dt);if(Math.hypot(p.x-230,p.y-230)<45){world.food+=dt*(1+p.skills.agricultura*4);learn(p,'agricultura',dt*.015);p.job='agricultor';if(p.skills.agricultura>.6&&Math.random()<dt*.006){world.farms++;mem(p,'melhorou o cultivo')}}}else if(a==='coleta'){move(p,-280,-180,dt);if(Math.hypot(p.x+280,p.y+180)<45){world.wood+=dt*(1+p.skills.coleta*3);learn(p,'coleta',dt*.01);p.job='coletor'}}else if(a==='construção'){move(p,0,0,dt);if(Math.hypot(p.x,p.y)<45&&world.wood>3&&world.stone>2){world.wood-=dt;world.stone-=dt*.5;learn(p,'construção',dt*.018);p.job='construtor';if(p.home===null&&p.money>25&&Math.random()<dt*.02){houses.push({x:R(-500,500),y:R(-350,350),owner:p.id});p.home=houses.length-1;p.money-=25;world.houses++;ev(p.name+' construiu uma casa')}}}else if(a==='pesquisa'){let q=near(p);if(q)move(p,q.x,q.y,dt);if(Math.random()<dt*.012){learn(p,'pesquisa',dt*.03);let s=skills[(Math.random()*skills.length)|0];p.skills[s]=cl(p.skills[s]+.03,0,1);mem(p,'testou uma hipótese sobre '+s)}}else if(a==='social'){let q=near(p);if(q){move(p,q.x,q.y,dt);if(Math.hypot(p.x-q.x,p.y-q.y)<25){let s=skills.reduce((a,b)=>p.skills[a]>p.skills[b]?a:b);q.skills[s]=cl(q.skills[s]+dt*.012,0,1);learn(p,'comunicação',dt*.004);if(Math.random()<dt*.02)mem(p,'aprendeu com '+q.name)}}}else if(a==='comércio'){let q=near(p);if(q){move(p,q.x,q.y,dt);if(Math.hypot(p.x-q.x,p.y-q.y)<25&&p.money>1){p.money--;q.money++;learn(p,'comércio',dt*.012);p.job='comerciante'}}}else if(a==='descanso')p.energy=cl(p.energy+dt*.035,0,1);else if(a==='medicina'){let q=near(p,z=>z.health<.8)||p;if(q===p)p.health=cl(p.health+dt*.012,0,1);else{move(p,q.x,q.y,dt);if(Math.hypot(p.x-q.x,p.y-q.y)<25){q.health=cl(q.health+dt*.02,0,1);learn(p,'medicina',dt*.015);p.job='curador'}}}if(p.health<=0&&p.alive){p.alive=false;ev(p.name+' morreu aos '+p.age.toFixed(1)+' anos')}}function tick(){day++;if(day%365===0){year++;ev('Ano '+year+' começou')}let a=people.filter(p=>p.alive);world.food=Math.max(0,world.food-a.length*.045);world.water=Math.max(0,world.water-a.length*.12);if(day%12===0)a.forEach(p=>{if(Math.random()<.5)p.action=choose(p);act(p,.8)});a.forEach(p=>{if(Math.random()<.02)p.action=choose(p)});world.stability=cl(.8-(world.food<80?.2:0)-(world.water<1000?.1:0)+world.culture*.04,.05,1)}function S(x,y){return[W/2+px+x*zoom,H/2+py+y*zoom]}function draw(){x.fillStyle='#5d8565';x.fillRect(0,0,W,H);x.fillStyle='#4b8b59';let q=S(0,0);x.fillRect(q[0]-800*zoom,q[1]-600*zoom,1600*zoom,1200*zoom);x.fillStyle='#4d8fb8';x.fillRect(S(-650,-340)[0],S(-650,-340)[1],1300*zoom,85*zoom);x.strokeStyle='#a99070';x.lineWidth=12*zoom;for(let z=-600;z<=600;z+=150){let a=S(z,-350),b=S(z,350);x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke()}for(let z=-300;z<=300;z+=120){let a=S(-600,z),b=S(600,z);x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke()}x.fillStyle='#8e9d48';let f=S(170,170);x.fillRect(f[0],f[1],130*zoom,100*zoom);houses.forEach(h=>{let a=S(h.x,h.y),w=42*zoom,hg=30*zoom;x.fillStyle='#d1b083';x.fillRect(a[0]-w/2,a[1]-hg/2,w,hg);x.fillStyle='#754b42';x.beginPath();x.moveTo(a[0]-w*.6,a[1]-hg/2);x.lineTo(a[0],a[1]-hg);x.lineTo(a[0]+w*.6,a[1]-hg/2);x.fill()});people.filter(p=>p.alive).forEach(p=>{let a=S(p.x,p.y),r=6*zoom;x.fillStyle=p===sel?'#fff0a0':p.health<.5?'#df7464':p.job==='agricultor'?'#9bcf71':'#e7d1bd';x.beginPath();x.arc(a[0],a[1]-r*1.5,r*.7,0,7);x.fill();x.fillStyle='#365b91';x.fillRect(a[0]-r,a[1]-r*.7,r*2,r*1.8)})}function ui(){let a=people.filter(p=>p.alive),s=a.reduce((n,p)=>n+p.health,0)/(a.length||1),k=Math.min(100,world.knowledge),c=Math.min(100,world.culture*100),t=world.stability*100;[['yr',year],['pop',a.length],['food',world.food|0],['water',world.water|0],['tech',world.discoveries.length],['sur',(s*100).toFixed(0)+'%'],['know',k|0],['cult',c|0],['stab',(t|0)+'%'],['disc',world.discoveries.length],['houses',world.houses],['farms',world.farms]].forEach(([i,v])=>document.getElementById(i).textContent=v);[['sb',s*100],['kb',k],['cb',c],['tb',t]].forEach(([i,v])=>document.getElementById(i).style.width=cl(v,0,100)+'%');if(sel){detail.classList.add('on');dt.textContent=sel.name.toUpperCase()+' · '+(sel.alive?'VIVO':'FALECIDO');dk.innerHTML=`<span>Idade</span><b>${sel.age.toFixed(1)}</b><span>Saúde</span><b>${(sel.health*100)|0}%</b><span>Humor</span><b>${(sel.mood*100)|0}%</b><span>Energia</span><b>${(sel.energy*100)|0}%</b><span>Profissão</span><b>${sel.job}</b><span>Ação</span><b>${sel.action}</b><span>Inteligência</span><b>${(sel.intel*100)|0}</b><span>Dinheiro</span><b>${sel.money.toFixed(1)}</b><span>Memórias</span><b>${sel.mem.length}</b>`;dm.innerHTML='<b>Memória:</b><br>'+sel.mem.slice(0,8).map(m=>'• '+m).join('<br>')}else detail.classList.remove('on')}function loop(t){let dtm=Math.min(.05,(t-last)/1000)*spd;last=t;if(!paused){acc+=dtm;while(acc>.08){acc-=.08;tick()};people.filter(p=>p.alive).forEach(p=>act(p,dtm))}draw();ui();requestAnimationFrame(loop)}let drag=false,lx=0,ly=0;c.onwheel=e=>{zoom=cl(zoom*(e.deltaY<0?1.1:.91),.5,3);e.preventDefault()};c.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){px+=e.clientX-lx;py+=e.clientY-ly;lx=e.clientX;ly=e.clientY}};c.onpointerup=e=>{if(Math.hypot(e.clientX-lx,e.clientY-ly)<5){let a=people.filter(p=>p.alive).map(p=>({p,d:Math.hypot(...S(p.x,p.y).map((v,i)=>v-(i?e.clientY:e.clientX)))})).sort((a,b)=>a.d-b.d)[0];sel=a&&a.d<28?a.p:null}drag=false};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'CONTINUAR':'PAUSE'};speed.onclick=()=>{spd=spd===1?3:spd===3?10:1;speed.textContent=spd+'×'};reset.onclick=()=>location.reload();save.onclick=()=>{localStorage.MINICITY_SAVE=JSON.stringify({day,year,world,people});ev('Estado salvo localmente')};onkeydown=e=>{if(e.code==='Space')pause.click();if(e.key.toLowerCase()==='r')location.reload()};ev('50 habitantes autônomos iniciaram a comunidade');ev('Cada indivíduo possui necessidades, memória, personalidade e habilidades próprias');requestAnimationFrame(loop);
</script></body></html>
