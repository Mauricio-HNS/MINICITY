<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINICITY — Living Tactical Simulation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#e8f0ff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}canvas{display:block;width:100%;height:100%;background:#02050a}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px}.panel{background:rgba(4,10,18,.82);border:1px solid rgba(130,170,220,.22);box-shadow:0 12px 40px rgba(0,0,0,.35);backdrop-filter:blur(10px);border-radius:12px;padding:10px 13px}.brand{font-weight:800;letter-spacing:.12em}.stats{display:flex;gap:14px;font-size:12px;color:#aebbd0}.stats b{color:#fff}.command{position:absolute;left:16px;bottom:16px;width:320px}.command h3{margin:0 0 8px;font-size:12px;letter-spacing:.12em;color:#8fb6ff}.command .row{display:flex;justify-content:space-between;font-size:12px;margin:6px 0}.bar{height:5px;background:#152033;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:60%;background:#68a7ff}.feed{position:absolute;right:16px;bottom:16px;width:300px;max-height:220px;overflow:hidden;font-size:11px;color:#aab8cc}.event{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}.controls{position:absolute;top:62px;right:16px;display:flex;gap:7px;pointer-events:auto}.controls button{background:rgba(8,16,28,.9);border:1px solid #273a56;color:#dce8ff;border-radius:8px;padding:7px 10px;cursor:pointer}.controls button:hover{border-color:#5c91d6}.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:10px;color:#62748d}
</style>
</head>
<body>
<canvas id="sim"></canvas>
<div class="hud">
  <div class="top"><div class="panel brand">MINICITY // COMMAND</div><div class="panel stats"><span>TIME <b id="time">00:00</b></span><span>UNITS <b id="units">0</b></span><span>BLUE <b id="blue">0</b></span><span>RED <b id="red">0</b></span><span>THREATS <b id="threats">0</b></span></div></div>
  <div class="controls"><button id="pause">PAUSE</button><button id="reset">RESET</button><button id="zoom">ZOOM</button></div>
  <div class="panel command"><h3>TACTICAL COMMAND</h3><div class="row"><span>Planet integrity</span><b id="integrity">100%</b></div><div class="bar"><i id="integrityBar"></i></div><div class="row"><span>Learning / adaptation</span><b id="learning">0.0</b></div><div class="bar"><i id="learningBar"></i></div><div class="row"><span>Resource pressure</span><b id="resources">NORMAL</b></div></div>
  <div class="panel feed" id="feed"></div><div class="hint">CLICK A SHIP TO FOLLOW · WHEEL TO ZOOM · SPACE PAUSE</div>
</div>
<script>
const c=document.getElementById('sim'),ctx=c.getContext('2d');let W,H,dpr;function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const TAU=Math.PI*2;let paused=false,follow=null,zoom=1,elapsed=0,planet=1,learning=0.08,events=[];const ships=[];const lasers=[];const debris=[];const keys={};
function rnd(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function addEvent(t){events.unshift({t,life:7});events=events.slice(0,8);document.getElementById('feed').innerHTML=events.map(e=>`<div class="event">${e.t}</div>`).join('')}
class Ship{constructor(team,type){this.team=team;this.type=type;this.x=rnd(-W*.35,W*.35);this.y=rnd(-H*.35,H*.35);this.vx=rnd(-.5,.5);this.vy=rnd(-.5,.5);this.r=type==='triangle'?8:9;this.hp=1;this.cool=rnd(0,2);this.age=0;this.skill=rnd(.25,.55);this.energy=1;this.mission='PATROL';this.target=null;this.angle=rnd(0,TAU);this.seed=Math.random()*1000}
update(dt){this.age+=dt;this.cool-=dt;this.energy=clamp(this.energy+dt*.025,0,1);let enemies=ships.filter(s=>s!==this&&s.hp>0&&s.team!==this.team),nearest=null,best=Infinity;for(const e of enemies){let d=dist(this,e);if(d<best){best=d;nearest=e}}this.target=nearest;let danger=enemies.some(e=>dist(this,e)<120);this.mission=danger?'ENGAGE':'PATROL';let cx=0,cy=0;const centerD=Math.hypot(this.x,this.y);if(centerD>Math.min(W,H)*.42){cx=-this.x*.002;cy=-this.y*.002}
 if(nearest&&best<260){let dx=nearest.x-this.x,dy=nearest.y-this.y,len=Math.hypot(dx,dy)||1;let desired=this.type==='triangle'?.75:.62;this.vx+=(dx/len)*desired*dt;this.vy+=(dy/len)*desired*dt;if(this.cool<=0&&this.energy>.15){lasers.push(new Laser(this,nearest));this.cool=Math.max(.35,1.25-this.skill*.7);this.energy-=.12}else if(best<65){this.vx-=dx/len*.5*dt;this.vy-=dy/len*.5*dt}}
 this.vx+=cx*dt;this.vy+=cy*dt;let max=this.type==='triangle'?1.35:1.05;let sp=Math.hypot(this.vx,this.vy);if(sp>max){this.vx=this.vx/sp*max;this.vy=this.vy/sp*max}this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;this.angle=Math.atan2(this.vy,this.vx);this.x*=.9995;this.y*=.9995;if(this.age>18&&Math.random()<dt*.003){this.skill=clamp(this.skill+.015,0,1);learning=clamp(learning+.004,0,1)}}
draw(){ctx.save();ctx.translate(W/2+this.x*zoom,H/2+this.y*zoom);ctx.rotate(this.angle);ctx.globalAlpha=.95;ctx.shadowBlur=12;ctx.shadowColor=this.team===0?'#55a7ff':'#ff4b61';ctx.strokeStyle=this.team===0?'#65b7ff':'#ff5368';ctx.fillStyle=this.team===0?'rgba(45,130,230,.35)':'rgba(230,55,75,.35)';ctx.lineWidth=1.4;if(this.type==='triangle'){ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-7,-6);ctx.lineTo(-4,0);ctx.lineTo(-7,6);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.beginPath();ctx.arc(0,0,6,0,TAU);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-4,-5);ctx.lineTo(-12,-9);ctx.lineTo(-9,-2);ctx.moveTo(-4,5);ctx.lineTo(-12,9);ctx.lineTo(-9,2);ctx.stroke()}ctx.restore()}}
class Laser{constructor(a,b){this.a=a;this.x=a.x;this.y=a.y;let dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;this.vx=dx/l*8;this.vy=dy/l*8;this.life=1.3;this.team=a.team;this.damage=.18+learning*.08}update(dt){this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;this.life-=dt;for(const s of ships){if(s.hp>0&&s.team!==this.team&&Math.hypot(this.x-s.x,this.y-s.y)<s.r+5){s.hp-=this.damage;this.life=0;if(s.hp<=0){debris.push({x:s.x,y:s.y,t:0});addEvent(`${this.team===0?'BLUE':'RED'} neutralizou uma unidade ${s.type.toUpperCase()}`)}break}}}draw(){ctx.save();ctx.strokeStyle=this.team===0?'#8bd1ff':'#ff8895';ctx.lineWidth=2;ctx.shadowBlur=10;ctx.shadowColor=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-this.vx*2,this.y-this.vy*2);ctx.stroke();ctx.restore()}}
function spawn(team){ships.push(new Ship(team,Math.random()<.52?'triangle':'orb'))}
function reset(){ships.length=0;lasers.length=0;debris.length=0;elapsed=0;planet=1;learning=.08;events=[];for(let i=0;i<20;i++)spawn(i%2);addEvent('Sistema iniciado: duas doutrinas autônomas em conflito.')}
reset();
function drawSpace(){ctx.fillStyle='#02050a';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);for(let i=0;i<120;i++){let x=((i*97)%W)-W/2,y=((i*53)%H)-H/2;ctx.fillStyle=`rgba(150,180,220,${.15+((i%5)/30)})`;ctx.fillRect(x,y,1,1)}ctx.strokeStyle='rgba(80,130,190,.08)';for(let r=100;r<Math.min(W,H);r+=100){ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke()}ctx.restore();ctx.save();ctx.translate(W/2,H/2);ctx.shadowBlur=35;ctx.shadowColor='#234d75';ctx.fillStyle='rgba(30,70,100,.25)';ctx.beginPath();ctx.arc(0,0,Math.min(W,H)*.09,0,TAU);ctx.fill();ctx.strokeStyle='rgba(90,170,230,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,Math.min(W,H)*.09,0,TAU);ctx.stroke();ctx.restore()}
function loop(ts){requestAnimationFrame(loop);if(paused)return;let dt=Math.min(.033,(ts-(loop.last||ts))/1000);loop.last=ts;elapsed+=dt;drawSpace();for(const s of ships)if(s.hp>0)s.update(dt);for(let i=ships.length-1;i>=0;i--)if(ships[i].hp<=0)ships.splice(i,1);for(const l of lasers)l.update(dt);for(let i=lasers.length-1;i>=0;i--)if(lasers[i].life<=0)lasers.splice(i,1);for(const d of debris){d.t+=dt;ctx.save();ctx.translate(W/2+d.x*zoom,H/2+d.y*zoom);ctx.globalAlpha=Math.max(0,1-d.t/1.5);ctx.strokeStyle='#dce8ff';for(let k=0;k<5;k++){let a=k*1.25;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*d.t*20,Math.sin(a)*d.t*20);ctx.stroke()}ctx.restore()}for(const l of lasers)l.draw();for(const s of ships)if(s.hp>0)s.draw();for(let i=debris.length-1;i>=0;i--)if(debris[i].t>1.5)debris.splice(i,1);if(Math.random()<dt*.025&&ships.length<34){spawn(Math.random()<.5?0:1);addEvent('Comando: nova unidade entrou na simulação.')}
 if(Math.random()<dt*.03){planet=clamp(planet-rnd(0,.004),.25,1);if(planet<.7)addEvent('ALERTA: integridade planetária sob pressão.')}
 updateHud()}
function updateHud(){let b=ships.filter(s=>s.team===0).length,r=ships.filter(s=>s.team===1).length;document.getElementById('time').textContent=new Date(elapsed*1000).toISOString().substring(14,19);document.getElementById('units').textContent=ships.length;document.getElementById('blue').textContent=b;document.getElementById('red').textContent=r;document.getElementById('threats').textContent=ships.filter(s=>s.team===1&&Math.hypot(s.x,s.y)<170).length;document.getElementById('integrity').textContent=Math.round(planet*100)+'%';document.getElementById('integrityBar').style.width=(planet*100)+'%';document.getElementById('learning').textContent=learning.toFixed(2);document.getElementById('learningBar').style.width=(learning*100)+'%';document.getElementById('resources').textContent=ships.length>28?'PRESSURE':ships.length<14?'SCARCE':'NORMAL'}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){paused=!paused;document.getElementById('pause').textContent=paused?'RESUME':'PAUSE'}if(e.key==='r')reset()});c.addEventListener('wheel',e=>{zoom=clamp(zoom*(e.deltaY<0?1.12:.89),.55,2.4)});c.addEventListener('click',e=>{let x=(e.clientX-W/2)/zoom,y=(e.clientY-H/2)/zoom,best=24;follow=null;for(const s of ships){let d=Math.hypot(x-s.x,y-s.y);if(d<best){best=d;follow=s}}});document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'RESUME':'PAUSE'};document.getElementById('reset').onclick=reset;document.getElementById('zoom').onclick=()=>zoom=zoom<1.2?1.8:1;requestAnimationFrame(loop);
</script></body></html>
