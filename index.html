<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINICITY — Artificial Society</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100b;color:#e8f4e8;font-family:Inter,system-ui,Arial}canvas{display:block;width:100%;height:100%;background:#08130c}</style></head><body><canvas id="world"></canvas><script>const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1,zoom=1,paused=false,speed=1,selected=null,simTime=0,last=performance.now();function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const world={w:1500,h:1000,year:1,food:240,water:320,wood:180,stone:140,ore:80,seeds:45,fish:55,medicine:10,tools:20,houses:10,farms:1,workshops:0,roads:0,knowledge:0,culture:0,stability:1,survival:1,tech:0,discoveries:new Set(),events:[],memory:[]};const people=[];let nextId=1;for(let i=0;i<50;i++){people.push({id:nextId++,name:'Habitante-'+String(i+1).padStart(2,'0'),age:18+Math.random()*37,x:-280+Math.random()*560,y:-180+Math.random()*360,health:1,energy:.7+Math.random()*.3,hunger:0,thirst:0,mood:.6+Math.random()*.4,intel:.35+Math.random()*.55,curiosity:.2+Math.random()*.75,memory:[],knowledge:new Set(),skills:{},inventory:{food:2,water:2},money:10+Math.random()*20,relations:{},goal:'sobreviver',action:'observando',manualTarget:null});}function log(t){world.events.unshift({text:t,t:simTime});world.events=world.events.slice(0,10)}function move(p,tx,ty,dt){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*22*dt;p.y+=dy/d*22*dt}function chooseAction(){return ['explorar','coletar','observar','descansar'][Math.floor(Math.random()*4)]}function act(p,dt){if(p.manualTarget){const d=Math.hypot(p.manualTarget.x-p.x,p.manualTarget.y-p.y);if(d>8)move(p,p.manualTarget.x,p.manualTarget.y,dt);else{p.manualTarget=null;p.action=chooseAction()}}else{p.action=chooseAction();p.x+=Math.sin(simTime/1000+p.id)*dt*3;p.y+=Math.cos(simTime/1200+p.id)*dt*3}p.x=clamp(p.x,-700,700);p.y=clamp(p.y,-450,450)}function hud(){}function draw(){ctx.fillStyle='#9fb98c';ctx.fillRect(0,0,W,H)}function loop(now){const dt=Math.min(.05,(now-last)/1000)*speed;last=now;if(!paused){simTime+=dt;for(const p of people)act(p,dt)}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.body.insertAdjacentHTML('beforeend','<div id="hud" style="position:fixed;top:12px;left:12px;padding:10px 14px;border:1px solid #45664b;border-radius:10px;background:#07110de8;font:12px system-ui;z-index:10">MINICITY · <b>50 habitantes</b> · <span id="status">PAUSADA</span></div>');</script><script src="map-enhance.js"></script></body></html>
