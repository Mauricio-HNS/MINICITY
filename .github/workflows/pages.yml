name: Deploy MINICITY
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Inject guaranteed visual map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for marker in ['<script src="map-enhance.js"></script>','<script src="visual-map.js?v=3"></script>']:
              s=s.replace(marker,'')
          s=s.replace('</body>','<script src="map-enhance.js?v=3"></script>\n<script src="visual-map.js?v=3"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
